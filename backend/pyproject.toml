[project]
name = "orea-api"
version = "1.0.0"
description = "API d'Orea : la plateforme qui aide les Abidjanais à retrouver leurs pièces perdues."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "rapidfuzz>=3.10",
    "qrcode[pil]>=8.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.17",
    "jinja2>=3.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.10,<5",  # la v5 retire les cascades de Haar
]

[project.optional-dependencies]
# Lecture automatique des pièces. Facultatif : sans lui, l'API fonctionne et le
# formulaire se remplit à la main (PyTorch pèse plusieurs centaines de Mo).
ocr = ["easyocr>=1.7.2"]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: tests qui chargent le vrai modèle EasyOCR (pytest -m slow)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP046"]  # Depends() idiomatique ; Generic gardé pour Pydantic

[tool.ruff.lint.per-file-ignores]
# Tableaux de données de démonstration : plus lisibles sur une ligne.
"scripts/seed.py" = ["E501"]
