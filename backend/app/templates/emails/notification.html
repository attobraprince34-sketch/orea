{% extends "base.html" %}
{% block content %}
<p style="margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#0F5C47;">{{ eyebrow }}</p>
<h1 style="margin:0 0 18px;font-family:Sora,Segoe UI,Helvetica,Arial,sans-serif;font-size:26px;line-height:1.25;font-weight:800;color:#0E1A16;">{{ subject }}</h1>
<p style="margin:0 0 14px;font-size:16px;line-height:1.6;">Bonjour {{ name }},</p>
<p style="margin:0 0 28px;font-size:16px;line-height:1.6;">{{ body }}</p>
{% if url %}
<table role="presentation" cellpadding="0" cellspacing="0">
  <tr>
    <td style="border-radius:999px;background:#F08A24;border:2px solid #0E1A16;box-shadow:4px 4px 0 #0E1A16;">
      <a href="{{ url }}" style="display:inline-block;padding:14px 28px;font-size:16px;font-weight:700;color:#0E1A16;text-decoration:none;">{{ cta }}</a>
    </td>
  </tr>
</table>
<p style="margin:22px 0 0;font-size:13px;line-height:1.6;color:#3F5A51;">Le bouton ne marche pas ? Copie ce lien : <br><a href="{{ url }}" style="color:#0F5C47;word-break:break-all;">{{ url }}</a></p>
{% endif %}
{% endblock %}
