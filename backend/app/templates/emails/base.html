<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#F6F8F7;font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;color:#0E1A16;">
  <!-- Texte d'aperçu affiché par les messageries sous l'objet -->
  <div style="display:none;max-height:0;overflow:hidden;">{{ preheader }}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F6F8F7;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">

          <!-- En-tête : logo Orea (épingle + mot-symbole) -->
          <tr>
            <td style="background:#0F5C47;border-radius:24px 24px 0 0;padding:26px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="vertical-align:middle;padding-right:10px;">
                    <div style="width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#FFFFFF;text-align:center;">
                      <div style="display:inline-block;margin-top:9px;width:12px;height:12px;border-radius:50%;background:#F08A24;"></div>
                    </div>
                  </td>
                  <td style="vertical-align:middle;font-family:Sora,Segoe UI,Helvetica,Arial,sans-serif;font-size:28px;font-weight:800;letter-spacing:-0.5px;color:#FFFFFF;">orea</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Contenu -->
          <tr>
            <td style="background:#FFFFFF;padding:36px 32px 32px;border-left:2px solid #0E1A16;border-right:2px solid #0E1A16;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Pied de page -->
          <tr>
            <td style="background:#EAF3EF;border:2px solid #0E1A16;border-top:0;border-radius:0 0 24px 24px;padding:20px 32px;font-size:13px;line-height:1.6;color:#3F5A51;">
              Tu reçois cet e-mail parce que tu as un compte Orea.<br>
              Orea ne te demandera <strong>jamais</strong> le numéro de ta pièce par e-mail ou par téléphone.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
